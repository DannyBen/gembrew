plugins:
  - rubocop-performance
  - rubocop-rspec

inherit_gem:
  rentacop:
    - rentacop.yml
    - rspec.yml

AllCops:
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - dev/**/*
    - spec/fixtures/**/*

# Allow compact Pathname composition: path/"child"
Layout/SpaceAroundOperators:
  Enabled: false
